# tools/.swiftlint.yml — impeccable-swift custom_rules (line-regex tier)
# Docs: https://realm.github.io/SwiftLint/custom_rules.html
#
# Drop-in use:
#   cp tools/.swiftlint.yml <your-project>/.swiftlint.yml
#   swiftlint lint --config .swiftlint.yml
#
# Scope:
#   `included:` controls which files SwiftLint scans. By default this config
#   scans the current directory (`.`). Tune `included:` / `excluded:` for your
#   project layout — typically you want to exclude test targets, generated
#   code, Swift Package build products, and any intentional fixture files.
#
# Tiers:
#   This file ships the *line-regex tier* only: cheap pattern matches that
#   catch the common impeccable design violations. A future AST tier
#   (SwiftSyntax-based, in tools/impeccable-lint) will catch multi-line cases
#   that plain regex can't express without false positives.

included:
  - .

excluded:
  - tools/fixtures
  - tools/impeccable-lint/Tests
  - .build
  - Packages
  - DerivedData
  - .swiftpm

only_rules:
  - custom_rules

custom_rules:
  no_hardcoded_hex_color:
    name: "No hardcoded hex color"
    # Negative lookbehind prevents matching `UIColor(` / `NSColor(`, which
    # are handled by the stricter error rule `no_uikit_nskit_color_literal`.
    regex: '(?<!UI)(?<!NS)Color\(\s*(?:red|hex)\s*:'
    message: "Use Asset Catalog semantic color, not hardcoded hex. See impeccable/reference/color-and-contrast.md."
    severity: error

  no_uikit_nskit_color_literal:
    name: "No UIKit/AppKit color literal"
    regex: '(?:UIColor|NSColor)\(\s*(?:red|hex|white|displayP3Red)\s*:'
    message: "Hardcoded platform color. Use Asset Catalog semantic color."
    severity: error

  no_fixed_system_font_size:
    name: "No fixed system font size"
    regex: '\.font\(\s*\.system\(\s*size\s*:'
    message: "Fixed-pt body text breaks Dynamic Type. Use `.font(.body)`, semantic styles, or `@ScaledMetric`."
    severity: error

  no_magic_spacing_padding:
    name: "No magic spacing (.padding)"
    regex: '\.padding\(\s*(?!(?:4|8|12|16|20|24|32|44|64)\s*\))\d+(?:\.\d+)?\s*\)'
    message: "Magic spacing. Stay on the 4pt scale (4, 8, 12, 16, 20, 24, 32, 44, 64)."
    severity: warning

  no_magic_spacing_frame:
    name: "No magic spacing (.frame width/height)"
    regex: '\.frame\([^)]*(?:width|height)\s*:\s*(?!(?:4|8|12|16|20|24|32|44|64)\b)\d+(?:\.\d+)?'
    message: "Magic spacing. Stay on the 4pt scale (4, 8, 12, 16, 20, 24, 32, 44, 64)."
    severity: warning

  continuous_corner_required:
    name: "Continuous corner required"
    # Matches `cornerRadius: N)` where the call closes with no `.continuous`
    # style argument. The `.continuous` case has a comma after the number,
    # so this regex skips it cleanly.
    regex: 'cornerRadius\s*:\s*\d+(?:\.\d+)?\s*\)'
    message: "Use `.continuous` corner style for superellipse. See impeccable/reference/spatial-design.md."
    severity: warning

  no_literal_system_color:
    name: "No literal system color"
    regex: '\.foregroundColor\(\s*\.(?:blue|red|green|yellow|orange|purple|pink|gray|brown|cyan|indigo|mint|teal|black|white)\s*\)'
    message: "Hardcoded system color. Use Asset Catalog semantic color."
    severity: warning

  no_print_in_production:
    name: "No print() in production"
    regex: '(?<!\w)print\('
    message: "`print()` calls leak to production. Use a proper logger (os.Logger)."
    severity: warning

  prefer_sf_symbols_comment:
    name: "Prefer SF Symbols over bundled bitmaps"
    regex: 'Image\(\s*"[^"]+\.(?:png|jpg|jpeg)"'
    message: "Prefer SF Symbols over bundled PNGs/JPGs where available. See impeccable/reference/sf-symbols.md. Full check via tools/asset-catalog-checker."
    severity: warning

  no_framed_sf_symbol:
    name: "No framed SF Symbol"
    regex: 'Image\(\s*systemName\s*:[^)]+\)\s*\.frame\('
    message: "Size SF Symbols with `.font()` or `.imageScale()`, not `.frame()`. See impeccable/reference/sf-symbols.md."
    severity: warning

  accessibility_hidden_on_text:
    name: "Accessibility hidden on possible text view"
    regex: '\.accessibilityHidden\(\s*true\s*\)'
    message: "accessibilityHidden(true) hides the view from VoiceOver. Verify the view does not contain semantic Text(...). Decorative-only views are fine; timestamps, sender names, status text are not. See impeccable/reference/accessibility.md."
    severity: warning

  material_on_content_layer:
    name: "Material on content-bearing view"
    regex: '\b(?:regular|thin|ultraThin|thick|ultraThick)Material\b'
    message: "Material reference detected. Materials belong on chrome / background layers only: never on content-bearing views (TextBubble, PhotoBubble, list rows, message cells). Coarse rule: matches all Material references, including legitimate background chrome usage. Verify the surrounding view layer before silencing. See impeccable/reference/materials.md."
    severity: warning

  monoculture_display_font:
    name: "Monoculture / trend display font"
    # Matches .font(.custom("<TrendFont>", ...)) — the named fonts below are
    # the AI-wave monoculture faces flagged in upstream impeccable v3.0.4-3.0.6
    # (commit b5c203f) and the brand.md reflex-reject list (skill-v3.1.1).
    # Canonical list: Fraunces, Geist (Sans/Mono), Mona Sans, Plus Jakarta Sans,
    # Space Grotesk, Recoleta, Instrument Sans, Instrument Serif, Syne,
    # DM Sans, DM Serif Display, DM Serif Text, Inter, Plus Jakarta Sans.
    # Coarse rule: matches .font(.custom("...")) with any of these names;
    # does not distinguish display vs body weight or size context.
    # False-positive risk: a project that has legitimately licensed Geist or
    # Mona Sans as its brand face (e.g. a Vercel-ecosystem tool) will see
    # spurious hits. Silence with // swiftlint:disable:next monoculture_display_font
    # and document the brand-font exception in your DESIGN.md.
    regex: '\.font\(\s*\.custom\(\s*"(?:Fraunces|Geist|Geist Sans|Geist Mono|Mona Sans|Plus Jakarta Sans|Space Grotesk|Recoleta|Instrument Sans|Instrument Serif|Syne|DM Sans|DM Serif Display|DM Serif Text)[^"]*"'
    message: "Trend / monoculture font detected. These faces saturate AI-generated UIs and read as generic by 2026. Prefer system fonts (.body, .headline, .largeTitle) for text hierarchy, or New York serif (.font(.custom(\"New York\", ...))) if a serif voice is required by brand. If this font is your established brand face, suppress this warning and document the exception in DESIGN.md. See impeccable/reference/typography.md."
    severity: warning

  italic_serif_headline:
    name: "Italic serif in display context"
    # Targets the single-line (or tightly chained) case: a .font(.custom()) with
    # a known serif face immediately followed by .italic() on the same line.
    # This is the subset of the upstream italic-serif-display rule that line
    # regex can catch cleanly. Multi-line modifier chains (font on one line,
    # .italic() several lines later) require AST-tier analysis and are deferred
    # to a future impeccable-lint rule.
    # Serif faces matched: Fraunces, Recoleta, Newsreader, Playfair Display,
    # Cormorant, Cormorant Garamond, Garamond, Tiempos, Lora, Spectral,
    # Merriweather, Baskerville, Georgia, DM Serif Display, DM Serif Text,
    # Instrument Serif, EB Garamond, Source Serif (4/Pro).
    # False-positive risk: editorial or magazine surfaces that intentionally
    # use italic serif for emphasis at display scale. If the design register
    # calls for it, suppress and document the intent in DESIGN.md.
    regex: '\.font\(\s*\.custom\(\s*"(?:Fraunces|Recoleta|Newsreader|Playfair Display|Playfair|Cormorant|Cormorant Garamond|Garamond|EB Garamond|Tiempos|Tiempos Headline|Lora|Spectral|Merriweather|Libre Baskerville|Baskerville|Georgia|DM Serif Display|DM Serif Text|Instrument Serif|Source Serif 4|Source Serif Pro|Source Serif)[^"]*"[^)]*\)[^.]*\.italic\(\)'
    message: "Italic serif at display scale is a saturated AI-startup hero pattern by 2026. Set the headline roman (remove .italic()), or switch to a non-serif display face. Reserve italic-serif for body emphasis in editorial / magazine contexts -- not for the primary hero. See impeccable/reference/typography.md."
    severity: warning
